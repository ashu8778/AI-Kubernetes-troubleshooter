[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-k8s-troubleshooter"
version = "1.0.0"
description = "AI Kubernetes Troubleshooter CLI - inspects a cluster and uses AI to analyze issues"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kubernetes>=32.0.0",
    "ollama>=0.5.0",
    "requests>=2.31.0",
]

[project.scripts]
k8s-troubleshooter = "k8s_troubleshooter.cli:main"

[tool.setuptools.packages.find]
include = ["k8s_troubleshooter*"]